<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Dota 2 Draft & Macro Simulator</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#14110f;--panel:#201b17;--line:#3a3028;--gold:#d8a84e;--txt:#ece4d6;--dim:#9a8f7e;--str:#e0483e;--agi:#3fb950;--int:#3b8ee8;--uni:#f0902c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.35 "Trebuchet MS",system-ui,sans-serif;overflow-x:hidden}
body{padding:0 env(safe-area-inset-right,0) calc(12px + env(safe-area-inset-bottom,0)) env(safe-area-inset-left,0);max-width:520px;margin:0 auto}
header{position:sticky;top:0;z-index:5;display:flex;gap:6px;padding:calc(12px + env(safe-area-inset-top,0px)) 8px 8px;background:#0e0c0a;border-bottom:2px solid var(--gold)}
header div{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 4px;text-align:center;font-size:11px;color:var(--dim);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
header b{display:block;font-size:14px;color:var(--gold);overflow:hidden;text-overflow:ellipsis}
#turn{display:none;margin:8px 10px 0;padding:9px 10px;background:linear-gradient(#4a3513,#2b1f0a);border:2px solid var(--gold);border-radius:8px;font:700 17px Georgia,serif;color:var(--gold);text-align:center}
#turn small{display:block;font:12px "Trebuchet MS",sans-serif;color:var(--txt)}
section{display:none;padding:10px}section.on{display:block}
h2{margin:6px 0 8px;font:700 18px Georgia,serif;color:var(--gold)}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tab{flex:1;padding:8px 2px;border:1px solid var(--line);border-bottom:3px solid var(--c,var(--line));background:var(--panel);color:var(--txt);border-radius:6px 6px 0 0;font-weight:700;font-size:12px}
.tab.on{background:var(--c);color:#fff}
.row{display:flex;gap:6px;align-items:center;margin-bottom:8px}
input[type=search]{flex:1;min-width:0;padding:9px;border-radius:6px;border:1px solid var(--line);background:#0e0c0a;color:var(--txt);font-size:14px}
label.sw{display:flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hero{position:relative;background:var(--panel);border:2px solid var(--c);border-radius:6px;padding:0;overflow:hidden;color:var(--txt);font-size:10px;text-align:center}
.hero .p{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.hero span.nm{display:block;padding:3px 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero.sel{opacity:.35;filter:grayscale(1)}
.hero .mk{position:absolute;top:1px;right:2px;font-size:14px}
.badge{display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;border-radius:5px;text-shadow:0 1px 2px #000}
.hero .p.badge{aspect-ratio:16/9;font-size:20px;border-radius:0}
.i.badge{width:100%;aspect-ratio:88/64;font-size:15px}
button{font:inherit;cursor:pointer}
.btn{padding:10px 12px;border:1px solid var(--gold);background:linear-gradient(#3a2d17,#241a0b);color:var(--gold);border-radius:6px;font-weight:700}
.btn:disabled{opacity:.4}
.btn.red{border-color:var(--str);color:#ff9a92;background:#2a1311}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.wide{grid-column:1/3}
.team{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:8px 0}
.team .slot{height:56px;position:relative;background:#0e0c0a;border:1px dashed var(--line);border-radius:6px;overflow:hidden;color:var(--txt);padding:0;display:flex;align-items:center;justify-content:center;font-size:18px}
.team .slot img,.team .slot .p.badge{display:flex;width:100%;height:100%;aspect-ratio:auto;object-fit:cover;object-position:top center;border-radius:0}
.team .slot.cur{border:2px solid var(--gold);box-shadow:0 0 8px var(--gold)}
.team .slot .tag{position:absolute;left:0;right:0;bottom:0;background:#000b;font-size:9px;line-height:13px;text-align:center;color:#fff}
.slot.itm{background:#0e0c0a;border:1px dashed var(--line);border-radius:6px;min-height:58px;padding:3px;color:var(--txt)}
.inv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.inv .itm.new{animation:pop .6s}
@keyframes pop{0%{transform:scale(.6);box-shadow:0 0 0 var(--gold)}60%{transform:scale(1.15);box-shadow:0 0 18px var(--gold)}100%{transform:scale(1)}}
.shop{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.it{background:var(--panel);border:1px solid var(--c);border-radius:6px;padding:3px;color:var(--txt);font-size:9px;text-align:center}
.it img.i{width:100%;display:block;border-radius:4px}
.it small{display:block;color:var(--gold)}
.lane{display:flex;gap:8px;align-items:center;margin-bottom:8px;background:var(--panel);padding:6px;border-radius:6px}
.lane .p{width:100px;height:56px;object-fit:cover;object-position:top center;flex:none;border-radius:4px}
.party{display:grid;gap:8px}
.party .btn{padding:16px;font-size:16px;text-align:left}
#chat{height:150px;overflow:auto;background:#0b0907;border:1px solid var(--line);border-radius:6px;padding:6px;font-size:12px}
#chat p{margin:0 0 3px}.al{color:#7fd48a}.en{color:#ff8b83}.sys{color:var(--gold)}.tm{color:#7fb8ff}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:#000d;border:1px solid var(--gold);padding:8px 14px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
#toast.on{opacity:1}
#modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:30;padding:20px}
#modal.on{display:flex}
.card{background:var(--panel);border:2px solid var(--gold);border-radius:12px;padding:16px;text-align:center;width:100%;max-width:380px;max-height:90vh;overflow:auto}
.card h3{margin:4px 0 8px;font:700 22px Georgia,serif;color:var(--gold)}
.res{display:flex;gap:8px;align-items:center;text-align:left;background:#0e0c0a;border-radius:6px;padding:6px;margin-bottom:6px;font-size:12px}
.res .m{font-size:30px}
.dim{color:var(--dim);font-size:12px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div>Золото<b id="gold">0</b></div>
  <div>Осколки<b id="shards">0</b></div>
  <div>Порядочность<b id="dec">10 000</b></div>
</header>
<div id="turn"></div>

<section id="s-party" class="on">
  <h2>Размер пати</h2>
  <p class="dim">Живые игроки ходят по очереди с одного устройства, остальные места займут боты.</p>
  <div class="party">
    <button class="btn" data-party="1">Соло (1 + 4 бота)</button>
    <button class="btn" data-party="2">Дуо (2 + 3 бота)</button>
    <button class="btn" data-party="3">Трио (3 + 2 бота)</button>
    <button class="btn" data-party="5">Фулл-пати (5 игроков)</button>
  </div>
</section>

<section id="s-draft">
  <h2>Драфт: выбери героя</h2>
  <div class="tabs" id="tabs"></div>
  <div class="row">
    <input type="search" id="q" placeholder="Поиск героя (рус / eng)">
    <button class="btn" id="qc" aria-label="Очистить">✕</button>
  </div>
  <div class="row"><label class="sw"><input type="checkbox" id="metaSw"> Мета патча 🔥</label><span class="dim" id="cnt"></span></div>
  <div class="grid" id="heroGrid"></div>
  <p class="dim">Последний пик можно отменить тапом по его слоту.</p>
  <div class="team" id="picked"></div>
</section>

<section id="s-lanes">
  <h2>Выбор роли</h2>
  <div class="lane" id="laneHero"></div>
  <div class="btns" id="roleBtns"></div>
</section>

<section id="s-match">
  <div class="team" id="teamRow"></div>
  <div class="tabs">
    <button class="tab on" style="--c:#8a6d3b" data-shop="basic">Компоненты</button>
    <button class="tab" style="--c:#7b5bd6" data-shop="final">Артефакты</button>
  </div>
  <div class="shop" id="shop"></div>
  <h2>Инвентарь <span class="dim">(тап — продать за 50%)</span></h2>
  <div class="inv" id="inv"></div>
  <div class="btns">
    <button class="btn" id="farm">Фармить +400</button>
    <button class="btn" id="pause">Пауза «?»</button>
    <button class="btn" id="tip">Типнуть в ответ (50 💎)</button>
    <button class="btn red" id="smash">Разбить шмотки и встать в Амулет</button>
    <button class="btn wide" id="endTurn">Закончить ход</button>
    <button class="btn wide" id="finish">Завершить игру и получить разбор</button>
  </div>
  <h2>Чат</h2>
  <div id="chat"></div>
</section>

<div id="modal"><div class="card">
  <h3>Разбор партии</h3>
  <div id="mList"></div>
  <p id="mText" class="dim"></p>
  <div class="btns"><button class="btn" id="share">Поделиться разбором</button><button class="btn" id="again">Новая партия</button></div>
</div></div>
<div id="toast"></div>

<script>
"use strict";
/* ===== Telegram ===== */
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

/* ===== Герои: [name, ru, slug, attr, meta] ===== */
const ATTRS = {str:{n:"Сила",c:"#e0483e"},agi:{n:"Ловкость",c:"#3fb950"},int:{n:"Интеллект",c:"#3b8ee8"},uni:{n:"Универсалы",c:"#f0902c"}};
const HEROES = [
 ["Axe","Топор","axe","str","A"],["Wraith King","Король-Призрак","skeleton_king","str","B"],["Pudge","Пудж","pudge","str","A"],
 ["Earthshaker","Землетряс","earthshaker","str","B"],["Sven","Свен","sven","str","C"],["Lifestealer","Лайфстилер","life_stealer","str","S"],["Underlord","Андерлорд","abyssal_underlord","str","A"],
 ["Anti-Mage","Анти-Маг","antimage","agi","B"],["Phantom Assassin","Фантомная убийца","phantom_assassin","agi","S"],["Drow Ranger","Дроу Рейнджер","drow_ranger","agi","B"],
 ["Juggernaut","Джаггернаут","juggernaut","agi","A"],["Shadow Fiend","Шэдоу Финд","nevermore","agi","C"],["Faceless Void","Фейслесс Войд","faceless_void","agi","A"],["Slark","Слэрк","slark","agi","S"],
 ["Crystal Maiden","Кристальная дева","crystal_maiden","int","B"],["Zeus","Зевс","zuus","int","A"],["Witch Doctor","Витч Доктор","witch_doctor","int","B"],
 ["Necrophos","Некрофос","necrolyte","int","S"],["Queen of Pain","Королева Боли","queenofpain","int","A"],["Storm Spirit","Шторм Спирит","storm_spirit","int","C"],["Outworld Destroyer","Разрушитель","obsidian_destroyer","int","B"],
 ["Meepo","Мипо","meepo","uni","C"],["Void Spirit","Войд Спирит","void_spirit","uni","A"],["Abaddon","Абаддон","abaddon","uni","B"],["Bane","Бейн","bane","uni","B"],
 ["Clockwerk","Клокверк","rattletrap","uni","A"],["Dazzle","Даззл","dazzle","uni","C"],["Enigma","Энигма","enigma","uni","B"],["Invoker","Инвокер","invoker","uni","S"],
 ["Magnus","Магнус","magnataur","uni","A"],["Mirana","Мирана","mirana","uni","B"],["Nyx Assassin","Никс","nyx_assassin","uni","A"],["Pangolier","Панголиер","pangolier","uni","S"],
 ["Sand King","Сэнд Кинг","sand_king","uni","B"],["Snapfire","Снапфайр","snapfire","uni","A"],["Techies","Техис","techies","uni","C"],["Timbersaw","Тимберсо","shredder","uni","B"],
 ["Vengeful Spirit","Венжфул Спирит","vengefulspirit","uni","A"],["Venomancer","Веномансер","venomancer","uni","S"],["Windranger","Виндранер","windrunner","uni","A"]
].map(h => ({name:h[0], ru:h[1], slug:h[2], attr:h[3], meta:h[4]}));
const MV = {S:3,A:2,B:1,C:0};
const hero = s => HEROES.find(h => h.slug === s);

/* ===== Предметы и рецепты ===== */
const BASE = {
 ogre_axe:["Ogre Axe",1000], mithril_hammer:["Mithril Hammer",1600], blight_stone:["Blight Stone",300],
 broadsword:["Broadsword",1000], blades_of_attack:["Blades of Attack",450], demon_edge:["Demon Edge",2200],
 claymore:["Claymore",1350], ring_of_health:["Ring of Health",700], void_stone:["Void Stone",700],
 blade_of_alacrity:["Blade of Alacrity",1000], band_of_elvenskin:["Band of Elvenskin",450], ultimate_orb:["Ultimate Orb",2800],
 point_booster:["Point Booster",1200], staff_of_wizardry:["Staff of Wizardry",1000],
 recipe_bkb:["Recipe (BKB)",1450], recipe_crystalys:["Recipe (Crystalys)",550], recipe_daedalus:["Recipe (Daedalus)",950],
 recipe_yasha:["Recipe (Yasha)",650], recipe_bfury:["Recipe (Battle Fury)",450]
};
const RECIPES = { // готовые предметы сначала, промежуточные в конце; цена = сумма частей
 black_king_bar:["Black King Bar",["ogre_axe","mithril_hammer","recipe_bkb"]],
 desolator:["Desolator",["mithril_hammer","mithril_hammer","blight_stone"]],
 greater_crit:["Daedalus",["lesser_crit","demon_edge","recipe_daedalus"]],
 bfury:["Battle Fury",["broadsword","claymore","perseverance","recipe_bfury"]],
 manta:["Manta Style",["yasha","ultimate_orb"]],
 ultimate_scepter:["Aghanim's Scepter",["point_booster","ogre_axe","blade_of_alacrity","staff_of_wizardry"]],
 lesser_crit:["Crystalys",["broadsword","blades_of_attack","recipe_crystalys"]],
 yasha:["Yasha",["blade_of_alacrity","band_of_elvenskin","recipe_yasha"]],
 perseverance:["Perseverance",["ring_of_health","void_stone"]]
};
const FIXED = {blink:["Blink Dagger",2250], shadow_amulet:["Shadow Amulet",900]};
const ICON = {band_of_elvenskin:"boots_of_elves", recipe_bkb:"recipe", recipe_crystalys:"recipe", recipe_daedalus:"recipe", recipe_yasha:"recipe", recipe_bfury:"recipe"};
const SHOP_FINAL = ["black_king_bar","desolator","greater_crit","bfury","manta","ultimate_scepter","blink","shadow_amulet","lesser_crit","yasha","perseverance"];
const iname = s => (BASE[s]||RECIPES[s]||FIXED[s])[0];
function icost(s){ if (BASE[s]) return BASE[s][1]; if (FIXED[s]) return FIXED[s][1]; return RECIPES[s][1].reduce((a,p)=>a+icost(p),0); }
const icolor = s => s.startsWith("recipe") ? "#777" : BASE[s] ? "#8a6d3b" : ["lesser_crit","yasha","perseverance"].includes(s) ? "#3b8ee8" : "#7b5bd6";

/* ===== Роли, предпочтения ботов, билды по таймингам ===== */
const ROLES = ["Керри","Мид","Оффлейн","Саппорт 4","Саппорт 5"];
const RS = ["К","М","О","П4","П5"];
const PREF = [["agi","str"],["int","uni","agi"],["str","uni"],["uni","int"],["int","uni"]];
const BUILDS = [
 ["broadsword","blades_of_attack","recipe_crystalys","demon_edge","recipe_daedalus","ogre_axe","mithril_hammer","recipe_bkb","blink"],
 ["blade_of_alacrity","band_of_elvenskin","recipe_yasha","ultimate_orb","blink","point_booster"],
 ["ogre_axe","mithril_hammer","recipe_bkb","blink","mithril_hammer","blight_stone"],
 ["blink","point_booster","ogre_axe","blade_of_alacrity","staff_of_wizardry"],
 ["point_booster","staff_of_wizardry","blade_of_alacrity","ogre_axe","blink"]
];
const R_MAX = 10;

/* ===== Состояние ===== */
const S = {tab:"str", q:"", meta:false, size:1, team:[], turn:0, phase:"party", round:1, shop:"basic", bot:null, wins:0, fights:0};
const $ = id => document.getElementById(id);
const rnd = a => a[Math.floor(Math.random()*a.length)];
const P = () => S.team[Math.min(S.turn, 4)] || null;
const worth = p => p.inv.reduce((a,s)=>a+icost(s),0);

/* ===== Картинки с fallback ===== */
function fb(i){ const s=document.createElement("span"); s.className=i.className+" badge"; s.style.background=i.dataset.c; s.textContent=i.dataset.n.replace(/[^A-Za-zА-Яа-я]/g,"").slice(0,2); i.onerror=null; i.replaceWith(s); }
function img(kind,slug,name,color,cls,lazy){
  return `<img class="${cls}" src="https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/${kind}/${slug}.png" alt="${name}" data-n="${name}" data-c="${color}" ${lazy?'loading="lazy" ':''}decoding="async" onerror="fb(this)">`;
}
const heroImg = (h,lazy)=>img("heroes",h.slug,h.name,ATTRS[h.attr].c,"p",lazy);
const itemImg = s=>img("items",ICON[s]||s,iname(s),icolor(s),"i",false);

/* ===== Звук ===== */
let AC=null;
function tone(f,t,d,type,v){ if(!AC) return; const o=AC.createOscillator(),g=AC.createGain(); o.type=type||"sine"; o.frequency.value=f; g.gain.setValueAtTime(v||.15,AC.currentTime+t); g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t+d); o.connect(g); g.connect(AC.destination); o.start(AC.currentTime+t); o.stop(AC.currentTime+t+d); }
function sfx(k){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; } }
  if(AC.state==="suspended") AC.resume();
  if(k==="click") tone(500,0,.06,"square",.06);
  if(k==="buy"){ tone(660,0,.08); tone(880,.08,.1); }
  if(k==="craft"){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.09,.25,"triangle",.2)); }
  if(k==="shard"){ [1568,2093,2637].forEach((f,i)=>tone(f,i*.07,.5,"sine",.18)); }
  if(k==="err") tone(140,0,.25,"sawtooth",.12);
  if(k==="smash"){ tone(90,0,.3,"sawtooth",.2); tone(60,.1,.4,"square",.15); }
}

/* ===== UI-утилиты ===== */
let tt;
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on"),1800); }
function stats(){ const p=P()&&P().live?P():null; $("gold").textContent=p?p.gold.toLocaleString("ru"):0; $("shards").textContent=p?p.shards:0; $("dec").textContent=p?p.dec.toLocaleString("ru"):"10 000"; }
function banner(stage){ const t=$("turn"); if(S.phase==="party"){ t.style.display="none"; return; } t.style.display="block"; t.innerHTML=`Ход: Игрок ${S.turn+1}<small>${stage}</small>`; }
function show(id){ document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===id)); window.scrollTo(0,0); }
function say(scope,who,text,cls){ const c=$("chat"),p=document.createElement("p"); p.className=cls; p.textContent=`[${scope}] ${who}: ${text}`; c.appendChild(p); while(c.children.length>70) c.removeChild(c.firstChild); c.scrollTop=c.scrollHeight; }
const bots = () => S.team.filter(t=>!t.live);
const ENEMY=["Мидер_Шторм","Рубик_Вард","Эйс_Сурен"];
const BOT_SAY=["Кто сказал «ГГ» на 15-й минуте?","Фармим лес, потом решим.","Дайте, пожалуйста, бкб, иначе гг.","Пингую — не вижу реакции.","Я бы сыграл лучше, но у нас такая команда."];
const ENEMY_SAY=["Ізі катка.","Вы вообще это собирали?","Удали игру, пока не поздно.","Кто вас драфтил?","Мейн-стрим-тактика: «беги»."];
const LOSS_SAY=["%p, ты слил линию. Репорт.","Опять %p на лане сидит, как на афк.","%p, нужен был вард, а не твои слёзы.","Гг, %p: ты лишил нас темпа.","Передай %p, что тут не тренировка."];

/* ===== Драфт ===== */
function draftAll(){
  $("tabs").innerHTML = Object.keys(ATTRS).map(k=>`<button class="tab ${S.tab===k?"on":""}" style="--c:${ATTRS[k].c}" data-t="${k}">${ATTRS[k].n}</button>`).join("");
  renderGrid(); renderPicked(); banner("выбери героя");
}
function renderGrid(){
  const q=S.q.trim().toLowerCase(), used=S.team.map(t=>t.hero);
  const list=HEROES.filter(h=>h.attr===S.tab && (!q || h.name.toLowerCase().includes(q) || h.ru.toLowerCase().includes(q)));
  $("heroGrid").innerHTML = list.map(h=>{
    const sel=used.includes(h.slug);
    const mk = S.meta ? (h.meta==="S"?"🔥":h.meta==="C"?"💀":"") : "";
    return `<button class="hero ${sel?"sel":""}" style="--c:${ATTRS[h.attr].c}" data-h="${h.slug}" ${sel?"disabled":""}>${heroImg(h,true)}${mk?`<span class="mk">${mk}</span>`:""}<span class="nm">${h.name}</span></button>`;
  }).join("") || `<p class="dim">Никого не найдено. Очисти поиск.</p>`;
  $("cnt").textContent=`Пик: ${Math.min(S.turn+1,S.size)}/${S.size}`;
}
function teamHtml(withRole){
  return S.team.map((t,i)=>{
    const h=t.hero&&hero(t.hero);
    const tag=(t.live?"И"+(i+1):"🤖")+(withRole&&t.role>=0?" "+RS[t.role]:"");
    if(!h) return `<div class="slot">${t.live?"?":"🤖"}</div>`;
    const undo = !withRole && t.live && i===S.turn-1 ? ` data-un="${i}"` : "";
    return `<button class="slot ${withRole&&i===S.turn?"cur":""}"${undo} title="${h.name}">${heroImg(h,false)}<span class="tag">${tag}</span></button>`;
  }).join("");
}
function renderPicked(){ $("picked").innerHTML=teamHtml(false); }

/* ===== Роли ===== */
function renderRoles(){
  const p=P(), h=hero(p.hero), taken=S.team.map(t=>t.role);
  $("laneHero").innerHTML=`${heroImg(h,false)}<div><b>${p.name}</b><br>${h.name}<br><span class="dim">Выбери линию и роль</span></div>`;
  $("roleBtns").innerHTML=ROLES.map((r,i)=>`<button class="btn" data-r="${i}" ${taken.includes(i)?"disabled":""}>${r}</button>`).join("");
  banner("расстановка по линиям");
}
function pickBot(role){
  const used=S.team.map(t=>t.hero);
  const pool=HEROES.filter(h=>!used.includes(h.slug)&&PREF[role].includes(h.attr))
    .map(h=>({h,sc:MV[h.meta]+Math.random()*2+(PREF[role][0]===h.attr?1:0)})).sort((a,b)=>b.sc-a.sc);
  return pool[0].h.slug;
}
function fillBots(){
  const free=[0,1,2,3,4].filter(r=>!S.team.some(t=>t.role===r));
  S.team.filter(t=>!t.live).forEach(b=>{ b.role=free.shift(); b.hero=pickBot(b.role); b.bi=0; });
}

/* ===== Крафт и покупки ===== */
function craft(inv){
  const made=[]; let changed=true;
  while(changed){
    changed=false;
    for(const k of Object.keys(RECIPES)){
      const copy=inv.slice(); let ok=true;
      for(const part of RECIPES[k][1]){ const i=copy.indexOf(part); if(i<0){ ok=false; break; } copy.splice(i,1); }
      if(ok){ inv.length=0; copy.forEach(x=>inv.push(x)); inv.push(k); made.push(k); changed=true; break; }
    }
  }
  return made;
}
function renderShop(){
  const list = S.shop==="basic" ? Object.keys(BASE) : SHOP_FINAL;
  $("shop").innerHTML = list.map(s=>`<button class="it" style="--c:${icolor(s)}" data-b="${s}">${itemImg(s)}${iname(s)}<small>${icost(s)}g</small></button>`).join("");
}
function renderInv(fresh){
  const p=P(); let h="";
  for(let i=0;i<6;i++){ const s=p.inv[i]; h+= s?`<button class="slot itm ${fresh&&i===p.inv.length-1?"new":""}" data-s="${i}">${itemImg(s)}</button>`:`<div class="slot itm"></div>`; }
  $("inv").innerHTML=h;
}
function renderMatch(fresh){
  $("teamRow").innerHTML=teamHtml(true); renderShop(); renderInv(fresh); stats();
  const last=S.turn>=S.size-1;
  $("endTurn").textContent=last?"Закончить раунд":"Закончить ход";
  banner(`закуп · раунд ${S.round}/${R_MAX}`);
}
function penalty(p,n,why){
  p.dec=Math.max(0,p.dec-n); p.shards+=50; p.cringe++; sfx("shard"); stats();
  say("все","Dota Plus",`${p.name}: +50 осколков за ${why}`,"sys");
  say("все",rnd(ENEMY),rnd(ENEMY_SAY),"en");
}
function buy(s){
  const p=P(), c=icost(s);
  if(p.gold<c){ sfx("err"); toast("Не хватает золота: нужно "+c+"g"); return; }
  const next=p.inv.concat([s]), made=craft(next);
  if(next.length>6){ sfx("err"); toast("Инвентарь переполнен — продай слот"); return; }
  const dup=p.inv.includes(s)&&!BASE[s];
  p.gold-=c; p.inv=next;
  if(made.length){ sfx("craft"); toast("Собрано: "+made.map(iname).join(", ")); say("команда","Система",`${p.name} собрал ${made.map(iname).join(", ")}`,"sys"); } else sfx("buy");
  renderInv(true); stats();
  if(s==="shadow_amulet") penalty(p,150,"кринжовый закуп: Shadow Amulet");
  else if(dup) penalty(p,200,"дубликат: "+iname(s));
}
function sell(i){
  const p=P(), s=p.inv[i]; if(!s) return;
  p.gold+=Math.floor(icost(s)/2); p.inv.splice(i,1); sfx("buy"); renderInv(false); stats();
  toast("Продано: "+iname(s));
}
function botBuy(b){
  const list=BUILDS[b.role];
  while(b.bi<list.length){
    const s=list[b.bi]; if(b.gold<icost(s)) break;
    const next=b.inv.concat([s]), made=craft(next);
    if(next.length>6) break;
    b.gold-=icost(s); b.inv=next; b.bi++;
    if(made.length) say("команда",b.name+" ("+ROLES[b.role]+")","собрал "+made.map(iname).join(", "),"tm");
  }
}

/* ===== Раунды ===== */
function endTurn(){
  sfx("click");
  if(S.turn<S.size-1){ S.turn++; renderMatch(false); toast("Ход: Игрок "+(S.turn+1)); return; }
  endRound();
}
function endRound(){
  const live=S.team.filter(t=>t.live);
  bots().forEach(b=>{ b.gold+=500+S.round*90; botBuy(b); });
  // линии
  live.forEach(p=>{
    const h=hero(p.hero), pr=.4+({S:.15,A:.08,B:.02,C:-.08})[h.meta]+Math.min(worth(p)/20000,.2);
    if(Math.random()<pr){ p.gold+=300; say("все","Система",`${p.name} выиграл линию (${ROLES[p.role]}) +300g`,"sys"); }
    else {
      p.lost++; penalty(p,100,"проигранная линия");
      const b=bots();
      if(b.length) say("команда",rnd(b).name,rnd(LOSS_SAY).replace("%p",p.name+" ("+ROLES[p.role]+")"),"tm");
      else say("все",rnd(ENEMY),`${p.name}, ты слил линию. Ez.`,"en");
    }
  });
  // тимфайт
  S.fights++;
  const avg=S.team.reduce((a,t)=>a+worth(t),0)/5, mavg=S.team.reduce((a,t)=>a+MV[hero(t.hero).meta],0)/5;
  const win=Math.random()<Math.max(.2,Math.min(.85,.3+Math.min(avg/10000,.35)+mavg*.05));
  if(win){ S.wins++; live.forEach(p=>p.gold+=600); sfx("buy"); say("все","Система","Тимфайт выигран! +600g всем живым игрокам","sys"); }
  else { live.forEach(p=>penalty(p,150,"слитый тимфайт")); say("команда",rnd(bots().concat(live)).name,"Кто зашёл первым? Репорт.","tm"); }
  if(S.round>=R_MAX){ finishGame(); return; }
  S.round++; S.turn=0; S.team.forEach(t=>t.farmed=false);
  renderMatch(false); toast("Раунд "+S.round+": Ход Игрока 1");
}

/* ===== Кнопки действий ===== */
$("farm").onclick=()=>{ const p=P(); if(p.farmed){ toast("В этом ходу уже фармил"); sfx("err"); return; } p.farmed=true; p.gold+=400; sfx("buy"); stats(); const b=bots(); if(b.length) say("команда",rnd(b).name,rnd(BOT_SAY),"tm"); };
$("pause").onclick=()=>{
  const p=P(); sfx("click"); p.dec=Math.max(0,p.dec-100); stats();
  say("все",p.name,"поставил игру на паузу","sys");
  let n=0; const iv=setInterval(()=>{ say("все",p.name,"? ".repeat(1+n),"al"); if(++n>=5){ clearInterval(iv); say("все",rnd(ENEMY),"Пауза из-за тебя, а не ради игры.","en"); } },280);
};
$("tip").onclick=()=>{
  const p=P(); if(p.shards<50){ sfx("err"); toast("Нужно 50 осколков Dota Plus"); return; }
  p.shards-=50; sfx("shard"); stats();
  say("все",p.name,"типнул "+rnd(ENEMY)+": «Спасибо за нубский закуп, лови чаевые!»","al");
  say("все",rnd(ENEMY),"Ты типнул, чтобы я заплакал? Работает.","en");
};
$("smash").onclick=()=>{
  const p=P(); if(!p.inv.length){ toast("Нечего разбивать"); return; }
  p.inv=["shadow_amulet"]; sfx("smash"); p.dec=Math.max(0,p.dec-500); p.shards+=50; p.cringe++; renderInv(true); stats();
  say("все",p.name,"разбил шмотки и встал в Амулет. Невидимый и счастливый.","al");
  say("все",rnd(ENEMY),"Он забаррикадировался в амулете! Репорт.","en"); sfx("shard");
};
$("endTurn").onclick=endTurn;
$("finish").onclick=finishGame;

/* ===== Итоги и шеринг ===== */
const RANKS=[["Рекрут","🪖"],["Страж","🛡️"],["Рыцарь","⚔️"],["Герой","🦸"],["Легенда","🏆"],["Властелин","👑"],["Божество","🌟"],["Титан","💎"]];
function result(p){
  const sc=Math.round(Math.min(1,p.dec/10000)*50 + MV[hero(p.hero).meta]/3*30 + Math.min(1,worth(p)/20000)*20);
  return {sc, r:RANKS[Math.min(7,Math.floor(sc/12.5))]};
}
function summary(){
  return S.team.filter(t=>t.live).map(p=>{ const r=result(p); return `${r.r[1]} ${p.name} (${hero(p.hero).name}, ${ROLES[p.role]}): ${r.r[0]}, ${r.sc} очк., порядочность ${p.dec}, осколки ${p.shards}`; });
}
function finishGame(){
  clearInterval(S.bot);
  $("mList").innerHTML=S.team.filter(t=>t.live).map(p=>{ const r=result(p);
    return `<div class="res"><span class="m">${r.r[1]}</span><div><b>${p.name}</b> · ${hero(p.hero).name} · ${ROLES[p.role]}<br>${r.r[0]}, ${r.sc} очк. · порядочность ${p.dec.toLocaleString("ru")} · 💎${p.shards}</div></div>`; }).join("");
  $("mText").textContent=`Тимфайтов выиграно: ${S.wins}/${S.fights}. Раундов сыграно: ${Math.min(S.round,R_MAX)}.`;
  $("modal").classList.add("on");
}
$("share").onclick=()=>{
  const text="Разбор партии в Dota 2 Draft & Macro Simulator:\n"+summary().join("\n");
  const url=location.href.startsWith("http")?location.href:"https://t.me";
  if(tg && tg.openTelegramLink){ tg.openTelegramLink("https://t.me/share/url?url="+encodeURIComponent(url)+"&text="+encodeURIComponent(text)); }
  else if(navigator.share){ navigator.share({title:"Разбор партии",text:text,url:url}).catch(()=>{}); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>toast("Разбор скопирован")).catch(()=>toast("Не удалось скопировать")); }
  else toast("Шеринг недоступен в этом браузере");
};
$("again").onclick=()=>{ $("modal").classList.remove("on"); clearInterval(S.bot); S.phase="party"; S.team=[]; S.turn=0; $("chat").innerHTML=""; banner(""); stats(); show("s-party"); };

/* ===== Старт партии ===== */
function startParty(n){
  S.size=n; S.turn=0; S.round=1; S.wins=0; S.fights=0; S.phase="draft"; S.tab="str"; S.q=""; $("q").value="";
  S.team=Array.from({length:5},(_,i)=>({name:i<n?"Игрок "+(i+1):"Бот "+(i-n+1), live:i<n, hero:null, role:-1, gold:0, shards:0, dec:10000, inv:[], cringe:0, farmed:false, lost:0, bi:0}));
  draftAll(); stats(); show("s-draft");
}
function startMatch(){
  S.phase="match"; S.turn=0; S.round=1;
  S.team.forEach(t=>{ t.gold=3000; });
  bots().forEach(botBuy);
  $("chat").innerHTML="";
  say("все","Система",`Матч начался. Играют ${S.size} чел. + ${5-S.size} ботов.`,"sys");
  clearInterval(S.bot);
  S.bot=setInterval(()=>{ const b=bots(); if(b.length&&Math.random()<.6) say("команда",rnd(b).name,rnd(BOT_SAY),"tm"); else say("все",rnd(ENEMY),rnd(ENEMY_SAY),"en"); },8000);
  renderMatch(false); show("s-match");
}

/* ===== События ===== */
document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(!AC) sfx("click");
  if(t.dataset.party){ startParty(+t.dataset.party); }
  else if(t.dataset.t){ S.tab=t.dataset.t; sfx("click"); draftAll(); }
  else if(t.dataset.h && S.phase==="draft"){
    P().hero=t.dataset.h; sfx("buy"); S.turn++;
    if(S.turn>=S.size){ S.turn=0; S.phase="role"; renderRoles(); show("s-lanes"); } else draftAll();
  }
  else if(t.dataset.un && S.phase==="draft"){ S.turn--; P().hero=null; draftAll(); }
  else if(t.dataset.r && S.phase==="role"){
    P().role=+t.dataset.r; sfx("buy"); S.turn++;
    if(S.turn>=S.size){ fillBots(); startMatch(); } else renderRoles();
  }
  else if(t.dataset.shop){ S.shop=t.dataset.shop; document.querySelectorAll("[data-shop]").forEach(b=>b.classList.toggle("on",b===t)); renderShop(); }
  else if(t.dataset.b) buy(t.dataset.b);
  else if(t.dataset.s) sell(+t.dataset.s);
});
$("q").oninput=e=>{ S.q=e.target.value; renderGrid(); };
$("qc").onclick=()=>{ $("q").value=""; S.q=""; renderGrid(); };
$("metaSw").onchange=e=>{ S.meta=e.target.checked; renderGrid(); };
banner(""); stats();
</script>
